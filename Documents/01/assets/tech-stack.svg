<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Node.js Complete Guide Technology Stack</title>
  <desc id="desc">A dark technical banner showing JavaScript, Node.js, Express, Turso, MongoDB, GraphQL, WebSockets, Stripe, and testing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#0f1f33"/>
      <stop offset="1" stop-color="#07131b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d353"/>
      <stop offset="0.5" stop-color="#4ff8d2"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .title { font: 700 38px Inter,Segoe UI,Arial,sans-serif; fill: #f8fafc; letter-spacing: 1px; }
      .subtitle { font: 500 16px Inter,Segoe UI,Arial,sans-serif; fill: #94a3b8; letter-spacing: 2px; }
      .label { font: 700 16px Inter,Segoe UI,Arial,sans-serif; fill: #e2e8f0; }
      .type { font: 500 11px Inter,Segoe UI,Arial,sans-serif; fill: #7dd3fc; letter-spacing: 1.2px; }
    </style>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="55" r="150" fill="#39d353" opacity=".06"/>
  <circle cx="105" cy="405" r="180" fill="#8b5cf6" opacity=".06"/>
  <path d="M55 142 H1145" stroke="url(#accent)" stroke-width="3" opacity=".8" filter="url(#glow)"/>
  <text x="600" y="66" text-anchor="middle" class="title">NODE.JS COMPLETE GUIDE</text>
  <text x="600" y="102" text-anchor="middle" class="subtitle">BACKEND ENGINEER DOCUMENTATION LAB</text>

  <g transform="translate(55 180)">
    <g><rect width="190" height="78" rx="14" fill="#172033" stroke="#f7df1e"/><circle cx="32" cy="29" r="17" fill="#f7df1e"/><text x="32" y="35" text-anchor="middle" font-family="Arial" font-weight="700" font-size="13" fill="#111827">JS</text><text x="60" y="31" class="label">JavaScript</text><text x="60" y="52" class="type">LANGUAGE</text></g>
    <g transform="translate(220)"><rect width="190" height="78" rx="14" fill="#172033" stroke="#39d353"/><path d="M32 12 48 21v19L32 49 16 40V21z" fill="none" stroke="#39d353" stroke-width="3"/><text x="60" y="31" class="label">Node.js</text><text x="60" y="52" class="type">RUNTIME</text></g>
    <g transform="translate(440)"><rect width="190" height="78" rx="14" fill="#172033" stroke="#cbd5e1"/><text x="32" y="38" text-anchor="middle" font-family="Arial" font-weight="700" font-size="24" fill="#f8fafc">Ex</text><text x="60" y="31" class="label">Express</text><text x="60" y="52" class="type">WEB FRAMEWORK</text></g>
    <g transform="translate(660)"><rect width="190" height="78" rx="14" fill="#172033" stroke="#4ff8d2"/><circle cx="32" cy="30" r="18" fill="none" stroke="#4ff8d2" stroke-width="3"/><path d="M21 31h22M26 21l12 19" stroke="#4ff8d2" stroke-width="2"/><text x="60" y="31" class="label">Turso</text><text x="60" y="52" class="type">SQL / LIBSQL</text></g>
    <g transform="translate(880)"><rect width="190" height="78" rx="14" fill="#172033" stroke="#47a248"/><path d="M32 12c10 11 11 25 0 38-11-13-10-27 0-38z" fill="#47a248"/><path d="M32 20v38" stroke="#9ae6b4"/><text x="60" y="31" class="label">MongoDB</text><text x="60" y="52" class="type">NOSQL DATA</text></g>
  </g>

  <g transform="translate(165 288)">
    <g><rect width="190" height="78" rx="14" fill="#172033" stroke="#e535ab"/><circle cx="32" cy="29" r="17" fill="none" stroke="#e535ab" stroke-width="2"/><circle cx="32" cy="29" r="5" fill="#e535ab"/><path d="M17 21h30M17 37h30M25 13l14 32M39 13 25 45" stroke="#e535ab" stroke-width="1.5"/><text x="60" y="31" class="label">GraphQL</text><text x="60" y="52" class="type">API LAYER</text></g>
    <g transform="translate(220)"><rect width="190" height="78" rx="14" fill="#172033" stroke="#38bdf8"/><path d="M18 39c8-20 20-20 28 0M20 28c7-11 17-11 24 0" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/><text x="60" y="31" class="label">WebSockets</text><text x="60" y="52" class="type">REAL TIME</text></g>
    <g transform="translate(440)"><rect width="190" height="78" rx="14" fill="#172033" stroke="#635bff"/><circle cx="32" cy="30" r="18" fill="#635bff"/><text x="32" y="37" text-anchor="middle" font-family="Arial" font-weight="700" font-size="20" fill="#fff">S</text><text x="60" y="31" class="label">Stripe</text><text x="60" y="52" class="type">PAYMENTS</text></g>
    <g transform="translate(660)"><rect width="190" height="78" rx="14" fill="#172033" stroke="#a78bfa"/><path d="M18 30l9 9 19-20" fill="none" stroke="#a78bfa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="31" class="label">Testing</text><text x="60" y="52" class="type">QUALITY</text></g>
  </g>
</svg>
